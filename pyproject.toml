[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "exolens"
version = "0.1.0"
description = "Reproducible analysis of transit-like features in TESS light curves"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "astropy>=6.1",
  "fastapi>=0.115",
  "lightkurve>=2.5",
  "numpy>=1.26",
  "pydantic>=2.8",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[project.scripts]
exolens = "exolens.cli:main"
exolens-api = "exolens.api:run"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = "-ra"
